name: Update APT repository

on:
  push:
    paths:
      - "debs/*.deb"
      - ".github/workflows/update-repo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9fk Packages
          bzip2 -9fk Packages
          rm -f Release
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="墨轩自用源" \
            -o APT::FTPArchive::Release::Label="墨轩自用源" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64 iphoneos-arm64e" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="墨轩自用 Sileo 软件源" \
            release . > Release.new
          mv Release.new Release
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Packages Packages.gz Packages.bz2 Release
          git diff --cached --quiet || git commit -m "Update package index"
          git push
