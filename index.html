<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#162d59">
  <title>墨轩自用源</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: white;
      background:
        radial-gradient(circle at 25% 20%, rgba(71, 128, 214, .28), transparent 28%),
        radial-gradient(circle at 80% 75%, rgba(63, 179, 255, .16), transparent 30%),
        #162d59;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 380px);
      padding: 32px 24px;
      text-align: center;
      animation: appear .5s ease-out;
    }
    .icon {
      width: 116px;
      height: 116px;
      margin: 0 auto 20px;
      border: 3px solid rgba(255, 255, 255, .45);
      border-radius: 28px;
      box-shadow: 0 0 32px rgba(80, 190, 255, .45);
    }
    h1 { margin: 0 0 6px; font-size: 32px; }
    p { margin: 0 0 30px; color: rgba(255, 255, 255, .68); }
    .button {
      display: block;
      margin-top: 12px;
      padding: 12px 20px;
      color: white;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .4);
      border-radius: 11px;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    .button.primary { background: #2589ed; border-color: #63b5ff; font-weight: 700; }
    .button:active { transform: scale(.97); }
    .source {
      display: block;
      margin-top: 28px;
      overflow-wrap: anywhere;
      color: rgba(255, 255, 255, .5);
      font-size: 12px;
      user-select: all;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(12px); } }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="CydiaIcon@3x.png" alt="墨轩自用源图标">
    <h1>墨轩自用源</h1>
    <p>RootHide · iphoneos-arm64e</p>
    <a class="button primary" href="sileo://source/https://moxuan1121.github.io/sileo-repo/">添加到 Sileo</a>
    <a class="button" href="https://github.com/moxuan1121/sileo-repo">查看 GitHub</a>
    <code class="source">https://moxuan1121.github.io/sileo-repo/</code>
  </main>
</body>
</html>
